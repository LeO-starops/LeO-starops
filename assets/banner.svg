<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#000c06" />
      <stop offset="0.4" stop-color="#000c06" stop-opacity="0.92" />
      <stop offset="0.75" stop-color="#000c06" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#00FF66" />
      <stop offset="0.5" stop-color="#7affb8" />
      <stop offset="1" stop-color="#00FF66" />
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="1200" height="420" rx="14" />
    </clipPath>

    <style>
      .matrix-text { font-family: 'Courier New', Consolas, monospace; font-size: 14px; }
      .term-text { font-family: 'Courier New', Consolas, monospace; }
      
      /* Rain Falling Animations */
      @keyframes fall1 { 0% { transform: translateY(-120px); } 100% { transform: translateY(440px); } }
      @keyframes fall2 { 0% { transform: translateY(-180px); } 100% { transform: translateY(440px); } }
      @keyframes fall3 { 0% { transform: translateY(-150px); } 100% { transform: translateY(440px); } }

      .r1 { animation: fall1 8s linear infinite; }
      .r2 { animation: fall2 10s linear infinite; }
      .r3 { animation: fall3 6.5s linear infinite; }

      /* Glitch animation */
      @keyframes glitch {
        0%, 100% { transform: translate(0,0); }
        2% { transform: translate(-3px, 1px); }
        4% { transform: translate(3px, -1px); }
        6% { transform: translate(0, 0); }
      }
      .glitch-title { animation: glitch 3.5s infinite; }

      /* Cursor blink */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- Dark Background -->
    <rect width="1200" height="420" fill="#000c06" />
    <rect width="1200" height="420" fill="url(#fade)" />

    <!-- Matrix Code Rain (Pure CSS Animated Streams across full width) -->
    <g opacity="0.6">
      <g transform="translate(20,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">0</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">1</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">サ</text></g>
      <g transform="translate(80,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">{</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">E</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">%</text></g>
      <g transform="translate(140,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">C</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">}</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">A</text></g>
      <g transform="translate(200,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">0</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">1</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">E</text></g>
      <g transform="translate(260,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">X</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">9</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">K</text></g>
      <g transform="translate(320,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">#</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">F</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">0</text></g>
      <g transform="translate(380,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">1</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">A</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">Z</text></g>
      <g transform="translate(440,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">コ</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">8</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">Y</text></g>
      <g transform="translate(500,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">B</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">5</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">L</text></g>
      <g transform="translate(560,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">0</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">S</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">1</text></g>
      <g transform="translate(620,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">Q</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">3</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">W</text></g>
      <g transform="translate(680,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">7</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">E</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">R</text></g>
      <g transform="translate(740,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">T</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">4</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">U</text></g>
      <g transform="translate(800,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">I</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">8</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">O</text></g>
      <g transform="translate(860,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">P</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">2</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">A</text></g>
      <g transform="translate(920,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">S</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">6</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">D</text></g>
      <g transform="translate(980,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">F</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">1</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">G</text></g>
      <g transform="translate(1040,0)" class="r3"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">H</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">0</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">J</text></g>
      <g transform="translate(1100,0)" class="r1"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">K</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">9</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">L</text></g>
      <g transform="translate(1160,0)" class="r2"><text y="0" class="matrix-text" fill="#00FF66" opacity="0.3">Z</text><text y="18" class="matrix-text" fill="#00FF66" opacity="0.6">7</text><text y="36" class="matrix-text" fill="#ffffff" opacity="0.9">X</text></g>
    </g>

    <!-- Scanline overlay -->
    <rect width="1200" height="420" fill="url(#scan)" />

    <!-- Terminal Command Line -->
    <text x="60" y="78" font-size="16" fill="#00FF66" class="term-text">amaan@kali:~# ./ethical_hacker --start</text>

    <!-- Header Title with Glitch -->
    <g font-size="62" font-weight="900" class="term-text" letter-spacing="1">
      <text x="58" y="165" fill="#00FF66" opacity="0.6" class="glitch-title">AL AMAAN NIZAMUDEEN</text>
      <text x="62" y="165" fill="#004d1a" opacity="0.8" class="glitch-title">AL AMAAN NIZAMUDEEN</text>
      <text x="60" y="165" fill="#ffffff" filter="url(#glow)">AL AMAAN NIZAMUDEEN</text>
    </g>

    <!-- Accent Line -->
    <rect x="60" y="192" width="520" height="3" fill="url(#edge)" />

    <!-- Subtitle -->
    <text x="60" y="226" font-size="17" fill="#7affb8" letter-spacing="2" class="term-text">VAPT  //  SOC ANALYST  //  RED + BLUE TEAM</text>

    <!-- Dynamic Specs -->
    <text x="60" y="274" font-size="20" fill="#e3ffef" class="term-text">> Junior Security Analyst  |  Web App VAPT & Threat Detection</text>

    <!-- Footer Certifications -->
    <text x="60" y="325" font-size="14" fill="#4d996e" class="term-text">[ Cisco Intro to Cybersecurity ]  [ OCSP Ongoing ]  [ Web & Network Recon ]</text>

    <!-- Blinking Cursor -->
    <rect x="60" y="348" width="10" height="18" fill="#00FF66" class="cursor" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="none" stroke="#00FF66" stroke-width="2" />
</svg>
